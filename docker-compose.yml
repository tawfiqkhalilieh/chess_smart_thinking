version: "3.8"

services:
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: my-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379 # Connects to the 'redis' service defined above
      - HTTP_USER=redis # Optional: for basic authentication
      - HTTP_PASSWORD=6379 # Optional: for basic authentication
    ports:
      - "8079:8079" # Map Redis Commander's port to your host
    depends_on:
      - redis # Ensures Redis starts before Redis Commander

  mongo:
    image: mongo
    restart: always
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
  scrapers-api:
    build:
      context: ./chess_smart_thinking_data_scraping_service
      dockerfile: Dockerfile
    working_dir: /app
    command: go run main.go
    volumes:
      - ./chess_smart_thinking_data_scraping_service/app:/app
    ports:
      - "8001:8001"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5

  arbiter-api:
    build:
      context: ./chess_smart_thinking_service_arbiter
      dockerfile: Dockerfile
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./chess_smart_thinking_service_arbiter/app:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
  
  ok-api:
    build:
      context: ./chess_smart_thinking_positions_analyzations_data_labeling_service
      dockerfile: Dockerfile
    working_dir: /app
    
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "3000:3000"
    command: yarn start
    
